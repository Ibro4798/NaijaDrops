<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogisLink - Log In</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2" style="bottom: auto; top: -10%; left: -10%; animation-delay: -2s;"></div>

    <div class="auth-wrapper fade-in-up">
        <div class="auth-sidebar">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="1 6 1 22 12 16 23 22 23 6 12 1 1 6"></polygon>
                        <polyline points="1 6 12 11 23 6"></polyline>
                        <line x1="12" y1="22" x2="12" y2="11"></line>
                    </svg>
                </div>
                <span>LogisLink</span>
            </div>

            <div class="auth-quote">
                "We reduced our <span class="gradient-text">carrier onboarding</span> time from weeks to minutes."
            </div>

            <div class="testimonial-author">
                <strong>Sarah Jenkins</strong>
                <span class="text-secondary" style="display:block; font-size: 0.85rem">VP Logistics,
                    GlobalFreight</span>
            </div>
        </div>

        <div class="auth-main">
            <div class="auth-header">
                <span class="text-secondary" style="margin-right:0.5rem">Don't have an account?</span>
                <a href="signup.html" class="link">Sign up</a>
            </div>

            <div class="auth-container">
                <h1 class="auth-title">Welcome back</h1>
                <p class="auth-subtitle">Enter your details to access your dashboard.</p>

                <form class="auth-form" id="authForm">
                    <div class="form-group">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" id="email" class="form-input" placeholder="name@company.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="remember">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="link" style="font-size: 0.85rem">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">
                        Sign in to account
                    </button>

                    <div class="divider">or continue with</div>

                    <button type="button" class="btn btn-outline btn-block"
                        style="display: flex; align-items: center; justify-content: center;">
                        <svg class="sso-icon" viewBox="0 0 24 24">
                            <path
                                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                                fill="#4285F4" />
                            <path
                                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                fill="#34A853" />
                            <path
                                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                                fill="#FBBC05" />
                            <path
                                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                                fill="#EA4335" />
                        </svg>
                        Google
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
